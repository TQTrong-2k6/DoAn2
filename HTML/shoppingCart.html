<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin giỏ hàng</title>
    <link rel="stylesheet" href="../style/header.css">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/buildPC.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!--Header-->
    <header class="global-header"></header>
    <!-- Sticky header khi scroll -->
    <div class="sticky-header" style="display: none; "></div>
    
    <header class="header-mobile active"></header>
    <nav class="global-menu"></nav>
    <section class="section-breadcrumb">
        <div class="container">
            <ol class="routing-link pb-[12px]">
                <li><a href="./index.html">Trang chủ</a></li>
                <li><a href="./shoppingCart.html">Thông tin giỏ hàng</a></li>
            </ol>
        </div>
    </section>
    <!-- Main content -->
    <main class="content">
       <div class="container cart-page">
            
       </div>
    </main>
    <!-- Support -->
    <div class="global-support">
        <div class="support-client">
            <div class="container">
                <div class="support-featured">
                    <ul>
                        <li>
                            <i class="fa-solid fa-truck-fast"></i>
                            <h3>GIAO HÀNG TOÀN QUỐC</h3>
                            <P>Giao hàng trước, trả tiền sau COD</P>
                        </li>
                        <li>
                            <i class="fa-solid fa-box"></i>
                            <h3>BẢO HÀNH TẬN NƠI</h3>
                            <P>Trọn gói 36 tháng linh kiện</P>
                        </li>
                        <li>
                            <i class="fa-solid fa-arrow-rotate-left"></i>
                            <h3>LỖI 1 ĐỔI 1</h3>
                            <P>Đổi mới trong vòng 30 ngày</P>
                        </li>
                        <li>
                            <i class="fa-solid fa-credit-card"></i>
                            <h3>THANH TOÁN TIỆN LỢI</h3>
                            <P>Trả tiền mặt, chuyển khoản, trả góp 0%</P>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- Icon Zalo button -->
    <div id="floating-icon-10">
        <a href="./index.html">
            <img src="../Logo/zalo-icon.png" alt="Zalo" width="45px" height="45px">
        </a>
    </div>
    <!-- Icon Messenger button -->
    <div id="floating-icon-20">
        <a href="./index.html">
            <img src="../Logo/messenger-icon.png" alt="Zalo" width="45px" height="45px">
        </a>
    </div>
    <!--footer-->
    <footer class="footer"></footer>
    <script src="../script/render/footerWeb.js"></script>
    <script src="../script/main.js"></script>
    <script src="../script/validator.js"></script>
    <script>
        const formEl = document.querySelector('#shoppingCart-form');

        if (formEl) {
            const form = new Validator('#shoppingCart-form');

            // Không validate khi blur (Validator gán bằng thuộc tính nên gán null là gỡ được)
            formEl.querySelectorAll('[name][rules]').forEach(input => {
                input.onblur = null;
            });

            form.onSubmit = async (formData) => {
                console.log(formData);
            };

            // Các nút không phải type="submit" thì kích hoạt submit thủ công
            formEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.payinsall, .bk-btn-installment, .bk-btn-installment-amigo');
                if (!btn) return;

                e.preventDefault();
                formEl.requestSubmit();
            });
        }
    </script>
    <script type="module" src="../script/render/shoppingCart.js"></script>
    <script type="module" src="../script/render/headerWeb.js"></script>
</body>
</html>
