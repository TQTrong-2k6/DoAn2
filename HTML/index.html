<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/header.css">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/footer.css">
    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!--Header-->
    <header class="global-header"></header>
    <!-- Sticky header khi scroll -->
    <div class="sticky-header" style="display: none; "></div>
    <!-- Main content -->
    <main class="content">
       <div class="container">
            <!-- Slide show -->
            <div class="section-hero">
                <div class="swiper swiper-hero">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img1.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img2.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img3.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img4.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img5.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img6.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img7.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img8.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img9.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="./index.html">
                                <img src="../slide-show/img10.jpg" alt="" width="1200" height="457" style="border-radius: 12px;">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="img-support">
                    <a href="./index.html">
                        <img src="../slide-show/img-support1.jpg" alt="" width="392" style="border-radius: 12px;">
                    </a>
                    <a href="./index.html">
                        <img src="../slide-show/img-support2.jpg" alt="" width="392" style="border-radius: 12px;">
                    </a>
                    <a href="./index.html">
                        <img src="../slide-show/img-support3.jpg" alt="" width="392" style="border-radius: 12px;">
                    </a>
                </div>
            </div>
            <!-- Sale -->
            <div class="section-collection">
                <div class="section-collection__header">
                    <div class="section-collection__header--title">
                        <i class="fa-solid fa-bolt-lightning light-animation"></i>
                        <p class="sale-title">FLASH SALE <span style="color: var(--color-primary);">GIỜ VÀNG</span>
                            <span class="sale-support">
                            Săn linh kiện cao cấp & Gear đỉnh giá sàn chỉ áp dụng trong ngày
                            </span>
                        </p>
                    </div>
                    <div class="time-sale">

                    </div>
                </div>
                <div class="swiper swiper-collection-product swiper-initialized swiper-horizontal swiper-pointer-events">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide product">
                            <div class="p-item">
                                <a href="" class="p-image">
                                    <img src="../slide-show/img-support1.jpg " alt="" width="205" height="138">
                                </a>
                                <a href="">
                                    <h3 class="p-name line-clamp-2">
                                        PC TTG GAMING LUXURY ULTRA 5 250K PLUS - RTX 5070 12GB OC WHITE
                                    </h3>
                                </a>
                                <div class="p-price">
                                    <div class="p-price-wrapper">
                                        <p class="p-price-sale">71.680.000 VNĐ</p>
                                        <del class="p-price-market">75.990.000 VNĐ</del>
                                    </div>
                                    <div class="p-price-off">-6%</div>
                                </div>
                                <div class="p-bottom">
                                    <button class="p-buy">
                                        <p class="p-buy-inner">
                                            <span class="p-buy-icon"><i class="fa-solid fa-cart-shopping"></i></span>
                                            THÊM VÀO GIỎ
                                        </p>
                                    </button>
                                    <p class="p-status">Còn hàng</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="swiper-button-next  swiper-custom-btn">

                    </div>
                    <div class="swiper-button-prev  swiper-custom-btn">

                    </div>
                </div>
            </div>
            <!-- Product -->
            <div class="section-category"></div>
       </div>
    </main>
    <!-- Support -->
    <div class="global-support"></div>
    <!-- Icon Zalo button -->
    <div id="floating-icon-10">
        <a href="./index.html">
            <img src="../Logo/zalo-icon.png" alt="Zalo" width="45px" height="45px">
        </a>
    </div>
    <!-- Icon Messenger button -->
    <div id="floating-icon-20">
        <a href="./index.html">
            <img src="../Logo/messenger-icon.png" alt="Zalo" width="45px" height="45px">
        </a>
    </div>
    <!--footer-->
    <footer class="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiperHero = new Swiper('.swiper-hero', {
            rewind: true,                // tới slide cuối thì trượt ngược về slide đầu
            speed: 600,                 // thời gian chuyển slide (ms)
            autoplay: {
                delay: 3000,            // tự chuyển sau 3 giây
                disableOnInteraction: false,  // vẫn tự chạy sau khi người dùng kéo/bấm
                pauseOnMouseEnter: true,      // dừng khi rê chuột vào
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
        const saleSwiper = new Swiper('.swiper-collection-product', {
            slidesPerView: 5,
            spaceBetween: 10,
            rewind: true,                // tới slide cuối thì trượt ngược về slide đầu
            speed: 600,                 // thời gian chuyển slide (ms)
            
            autoplay: {
                delay: 3000,            // tự chuyển sau 3 giây
                disableOnInteraction: false,  // vẫn tự chạy sau khi người dùng kéo/bấm
                pauseOnMouseEnter: true,      // dừng khi rê chuột vào
            },

            navigation: {
                nextEl: '.swiper-collection-product .swiper-button-next',
                prevEl: '.swiper-collection-product .swiper-button-prev',
            }
        });
    </script>
    <script src="../script/render/footerWeb.js"></script>
    <script type="module" src="../script/main.js"></script>
    <script src="../script/render/headerWeb.js"></script>
</body>
</html>
